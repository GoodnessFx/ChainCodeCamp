version: "3.8"

services:
  dev:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/chaincodecamp
    environment:
      - NEXT_PUBLIC_AUTH_PROVIDER=mock
      - NEXT_PUBLIC_SUPABASE_URL=
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=
      - GITHUB_CLIENT_ID=
      - GITHUB_CLIENT_SECRET=
    command: npm run dev